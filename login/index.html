<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b14">
<title>Login | KyoStore</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#29204b,#0b0b14 65%);color:#f5f3ff;font:15px/1.6 system-ui,Arial,sans-serif}
.card{width:100%;max-width:420px;padding:28px;background:#151523;border:1px solid #302e46;border-radius:22px;box-shadow:0 20px 70px #0005}
.logo{font-size:25px;font-weight:900}.logo span{color:#a78bfa}
.muted{color:#aaa8c2}
label{display:block;margin:16px 0 6px}
input{width:100%;padding:13px;background:#10101c;color:white;border:1px solid #39364f;border-radius:11px;font-size:15px}
button{width:100%;padding:13px;border-radius:11px;border:1px solid #39364f;background:#242338;color:white;font-weight:750;font-size:15px;margin-top:12px;cursor:pointer}
.primary{background:linear-gradient(120deg,#8b5cf6,#4f8cff);border:0}
#message{display:none;margin-top:14px;padding:12px;background:#28213b;border-radius:10px;overflow-wrap:anywhere}
a{color:#c4b5fd}
.small{font-size:12px;color:#aaa8c2}
</style>
</head>
<body>
<main class="card">
<div class="logo">Kyo<span>Store</span></div>
<h1>Selamat datang!</h1>
<p class="muted">Masuk atau buat akun untuk melanjutkan belanja digital.</p>

<form id="loginForm">
<label for="email">Alamat email</label>
<input id="email" type="email" placeholder="nama@email.com" autocomplete="email" required>

<label for="password">Password</label>
<input id="password" type="password" placeholder="Minimal 6 karakter" minlength="6" autocomplete="current-password" required>

<button class="primary" type="submit">Masuk dengan Email</button>
</form>

<button id="register">Buat Akun Baru</button>
<button id="google">Lanjutkan dengan Google</button>

<div id="message" role="status"></div>
<p class="small">Login belum aktif sebelum Supabase Auth dikonfigurasi. Tombol di halaman ini belum mengirim data akun.</p>
<a href="../">← Kembali ke toko</a>
</main>

<script>
const message=document.getElementById('message');
function show(text){
  message.textContent=text;
  message.style.display='block';
}
document.getElementById('loginForm').addEventListener('submit',function(e){
  e.preventDefault();
  show('Login belum diaktifkan. Supabase Auth perlu dikonfigurasi terlebih dahulu.');
});
document.getElementById('register').addEventListener('click',function(){
  show('Pendaftaran belum aktif. Aktifkan Email Provider di Supabase Auth terlebih dahulu.');
});
document.getElementById('google').addEventListener('click',function(){
  show('Login Google belum aktif. Konfigurasikan Google Provider dan OAuth di Supabase terlebih dahulu.');
});
</script>
</body>
</html>
